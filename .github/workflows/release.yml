# CD: đóng gói bản Release thật cho từng phiên bản Revit/AutoCAD và phát hành lên GitHub Releases.
# Chạy trên windows-latest (khác với tests.yml/check-build trên ubuntu) vì đây là build UseWPF thật —
# runner Linux không có WindowsDesktop SDK cho net48. Không cần cài Revit/AutoCAD: mọi tham chiếu API
# đều qua package NuGet (Nice3point.Revit.Api.RevitAPI*, AutoCAD.NET*).
#
# Kích hoạt: đẩy tag "vX.Y.Z" (ví dụ v1.0.0), hoặc chạy tay (workflow_dispatch) với input version.
name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Nhãn phiên bản cho gói (không có tag → dùng giá trị này, ví dụ 1.0.0-dev)'
        required: false
        default: '0.0.0-dev'

# Mặc định chỉ đọc cho MỌI job (build chạy pwsh + dotnet + choco + npx trên mã lấy về); riêng job
# publish mới cần ghi để tạo Release. Trước đây write cấp cho cả 5 job build — một package/action
# bị chiếm ở job build là đẩy được tag/commit bằng GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        # inputs.version đi qua biến môi trường, không nội suy thẳng vào script: giá trị
        # `1.0.0"$(...)"` từ workflow_dispatch sẽ được bash chạy nếu chèn bằng ${{ }}.
        # Tên tag cũng phải qua cùng bộ lọc: git cho phép `$ ( ) ; |` trong tên ref, và tag
        # `v1.2.3$(…)` vẫn khớp mẫu 'v*.*.*'. Output này được chèn vào pwsh/ISCC ở các job sau,
        # nên chỉ để lọt chữ, số, . + -.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi
          case "$version" in
            *[!A-Za-z0-9.+-]*|"") echo "version không hợp lệ: chỉ nhận chữ, số, . + -" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-revit:
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 2026 (net8.0-windows) thêm 2026-09-06 sau khi ba bộ ca kiểm chạy thật trên Revit 2026 — bang-chung-test.md §51.
        revit: [2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Build DhcbTools.Revit (Revit ${{ matrix.revit }})
        run: dotnet build src/DhcbTools.Revit/DhcbTools.Revit.csproj -c Release -p:RevitVersion=${{ matrix.revit }} -p:Version=${{ needs.version.outputs.version }}

      - name: Đóng gói
        shell: pwsh
        run: |
          # Hỏi MSBuild thay vì tự tính lại: Directory.Build.props là nơi duy nhất quyết định TFM
          # (net48 / net8.0-windows / net10.0-windows). Bản cũ hardcode "-ge 2025 → net8" nên thêm
          # 2027 vào ma trận là đóng gói NHẦM thư mục mà không có bước nào đỏ.
          $tfm = (dotnet msbuild src/DhcbTools.Revit/DhcbTools.Revit.csproj -p:RevitVersion=${{ matrix.revit }} -getProperty:TargetFramework -nologo).Trim()
          if ($LASTEXITCODE -ne 0) { throw "MSBuild không đọc được TargetFramework (mã $LASTEXITCODE)." }
          if (-not $tfm) { throw "Không đọc được TargetFramework từ MSBuild." }
          $out = "src/DhcbTools.Revit/bin/Release/$tfm"
          $pkg = "dist/DhcbTools.Revit-${{ matrix.revit }}-${{ needs.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item "$out/DhcbTools.Revit.addin" $pkg
          Copy-Item "$out/DhcbTools.Revit.dll", "$out/DhcbTools.Core.dll", "$out/DhcbTools.Shared.Logic.dll", `
                    "$out/DhcbTools.Shared.Hosting.dll", "$out/Newtonsoft.Json.dll" $pkg
          Copy-Item LICENSE, NOTICE $pkg
          Copy-Item docs/huong-dan-cai-dat-va-kiem-thu-thu-cong.md $pkg

      # Tag yêu cầu chứng chỉ (DHCB_SIGN_PFX_BASE64/_PASSWORD); build thủ công không có thì bỏ qua, gói
      # vẫn phát hành như trước. Bước riêng để secret chỉ vào đúng bước này, không vào bước build/restore.
      - name: Ký số DLL (nếu có chứng chỉ)
        shell: pwsh
        env:
          DHCB_SIGN_PFX_BASE64: ${{ secrets.DHCB_SIGN_PFX_BASE64 }}
          DHCB_SIGN_PFX_PASSWORD: ${{ secrets.DHCB_SIGN_PFX_PASSWORD }}
        run: ./scripts/sign-release.ps1 -Path dist -RequireSignature:($env:GITHUB_REF -like 'refs/tags/*')

      - name: Nén
        shell: pwsh
        run: |
          $pkg = "dist/DhcbTools.Revit-${{ matrix.revit }}-${{ needs.version.outputs.version }}"
          Compress-Archive -Path "$pkg/*" -DestinationPath "$pkg.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DhcbTools.Revit-${{ matrix.revit }}
          path: dist/*.zip
          if-no-files-found: error

  build-autocad:
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        acad: [2024, 2025, 2026]   # 2026 = R25.1, .NET 10 — đã chạy thật (bang-chung-test.md §24, §25)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # AutoCAD 2026 (net10.0-windows) cần SDK 10; 2024/2025 vẫn dùng SDK 8.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build vỏ đầy đủ (AutoCAD ${{ matrix.acad }})
        run: dotnet build src/DhcbTools.AutoCAD/DhcbTools.AutoCAD.csproj -c Release -p:RevitVersion=${{ matrix.acad }} -p:AcadVersion=${{ matrix.acad }} -p:Version=${{ needs.version.outputs.version }}

      - name: Build vỏ core-only cho accoreconsole (AutoCAD ${{ matrix.acad }})
        run: dotnet build src/DhcbTools.AutoCAD.Core/DhcbTools.AutoCAD.Core.csproj -c Release -p:RevitVersion=${{ matrix.acad }} -p:AcadVersion=${{ matrix.acad }} -p:Version=${{ needs.version.outputs.version }}

      - name: Đóng gói
        shell: pwsh
        run: |
          # Cùng lý do với job Revit: AutoCAD 2026+ là net10.0-windows, hardcode "-ge 2025 → net8" đóng gói nhầm.
          $tfm = (dotnet msbuild src/DhcbTools.AutoCAD/DhcbTools.AutoCAD.csproj -p:AcadVersion=${{ matrix.acad }} -getProperty:TargetFramework -nologo).Trim()
          if ($LASTEXITCODE -ne 0) { throw "MSBuild không đọc được TargetFramework (mã $LASTEXITCODE)." }
          if (-not $tfm) { throw "Không đọc được TargetFramework từ MSBuild." }
          $pkg = "dist/DhcbTools.AutoCAD-${{ matrix.acad }}-${{ needs.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          $full = "src/DhcbTools.AutoCAD/bin/Release/$tfm"
          Copy-Item "$full/DhcbTools.AutoCAD.dll", "$full/DhcbTools.Core.AutoCAD.dll", "$full/DhcbTools.Shared.Logic.dll", `
                    "$full/DhcbTools.Shared.Hosting.dll", "$full/Newtonsoft.Json.dll" $pkg
          $core = "src/DhcbTools.AutoCAD.Core/bin/Release/$tfm"
          Copy-Item "$core/DhcbTools.AutoCAD.Core.dll" $pkg
          # AutoCAD 2025+ nạp assembly .NET Core qua AssemblyLoadContext riêng; bundle đã chứng minh
          # chạy được trên AutoCAD 2026.1 (bang-chung-test.md §25) có kèm deps.json. net48 không có file này.
          if ($tfm -ne "net48") { Copy-Item "$full/DhcbTools.AutoCAD.deps.json" $pkg }
          # KHÔNG đóng gói System.Drawing.Common.dll dù nó nằm trong bin của net8/net10: AcDbMgd tham chiếu
          # nó nên chính AutoCAD đã cấp — §25 chạy thật với bundle KHÔNG có file này. Chép thêm bản riêng
          # chỉ tạo nguy cơ lệch phiên bản với bản AutoCAD đang chạy.
          Copy-Item LICENSE, NOTICE $pkg
          Copy-Item docs/huong-dan-cai-dat-va-kiem-thu-thu-cong.md $pkg

      # Tag yêu cầu chứng chỉ (DHCB_SIGN_PFX_BASE64/_PASSWORD); build thủ công không có thì bỏ qua, gói
      # vẫn phát hành như trước. Bước riêng để secret chỉ vào đúng bước này, không vào bước build/restore.
      - name: Ký số DLL (nếu có chứng chỉ)
        shell: pwsh
        env:
          DHCB_SIGN_PFX_BASE64: ${{ secrets.DHCB_SIGN_PFX_BASE64 }}
          DHCB_SIGN_PFX_PASSWORD: ${{ secrets.DHCB_SIGN_PFX_PASSWORD }}
        run: ./scripts/sign-release.ps1 -Path dist -RequireSignature:($env:GITHUB_REF -like 'refs/tags/*')

      - name: Nén
        shell: pwsh
        run: |
          $pkg = "dist/DhcbTools.AutoCAD-${{ matrix.acad }}-${{ needs.version.outputs.version }}"
          Compress-Archive -Path "$pkg/*" -DestinationPath "$pkg.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DhcbTools.AutoCAD-${{ matrix.acad }}
          path: dist/*.zip
          if-no-files-found: error

  build-batchrunner:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build BatchRunner
        run: dotnet build src/DhcbTools.BatchRunner/DhcbTools.BatchRunner.csproj -c Release -p:Version=${{ needs.version.outputs.version }}

      - name: Đóng gói kèm script và job mẫu
        shell: pwsh
        run: |
          $pkg = "dist/DhcbTools.BatchRunner-${{ needs.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path "$pkg/jobs", "$pkg/configs", "$pkg/scripts" | Out-Null
          # TFM hỏi MSBuild, không viết tay: hardcode ở đây đúng là lỗi đã sửa cho build-revit/build-autocad,
          # và nó im lặng — Copy-Item vào thư mục không tồn tại thì gói ra thiếu đúng cái .exe.
          $tfm = (dotnet msbuild src/DhcbTools.BatchRunner/DhcbTools.BatchRunner.csproj -getProperty:TargetFramework -nologo).Trim()
          if ($LASTEXITCODE -ne 0) { throw "MSBuild không đọc được TargetFramework (mã $LASTEXITCODE)." }
          if (-not $tfm) { throw "Không đọc được TargetFramework từ MSBuild." }
          Copy-Item "src/DhcbTools.BatchRunner/bin/Release/$tfm/*" $pkg -Recurse
          Copy-Item jobs/*.json "$pkg/jobs"
          Copy-Item configs/* "$pkg/configs"
          # Chỉ script người dùng — installer/batchrunner-scripts.txt. Trước đây scripts/*.py, *.ps1 kéo theo cả script
          # ký số/CI/ruleset vào máy kỹ sư. Thiếu file nào thì dừng: gói thiếu script là lỗi im lặng tới tay người dùng.
          Get-Content installer/batchrunner-scripts.txt |
            ForEach-Object { $_.Trim() } |
            Where-Object { $_ -and -not $_.StartsWith('#') } |
            ForEach-Object { Copy-Item (Join-Path scripts $_) "$pkg/scripts" -ErrorAction Stop }
          Copy-Item LICENSE, NOTICE $pkg
          Copy-Item docs/batch-runner.md, docs/huong-dan-cai-dat-va-kiem-thu-thu-cong.md $pkg

      # Tag yêu cầu chứng chỉ (DHCB_SIGN_PFX_BASE64/_PASSWORD); build thủ công không có thì bỏ qua, gói
      # vẫn phát hành như trước. Bước riêng để secret chỉ vào đúng bước này, không vào bước build/restore.
      - name: Ký số DLL (nếu có chứng chỉ)
        shell: pwsh
        env:
          DHCB_SIGN_PFX_BASE64: ${{ secrets.DHCB_SIGN_PFX_BASE64 }}
          DHCB_SIGN_PFX_PASSWORD: ${{ secrets.DHCB_SIGN_PFX_PASSWORD }}
        run: ./scripts/sign-release.ps1 -Path dist -RequireSignature:($env:GITHUB_REF -like 'refs/tags/*')

      - name: Nén
        shell: pwsh
        run: |
          $pkg = "dist/DhcbTools.BatchRunner-${{ needs.version.outputs.version }}"
          Compress-Archive -Path "$pkg/*" -DestinationPath "$pkg.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DhcbTools.BatchRunner
          path: dist/*.zip
          if-no-files-found: error

  installer:
    # Có verify: test đỏ thì không dựng installer — artifact DhcbTools-Setup-*.exe trông như phát hành được.
    needs: [verify, version, build-revit, build-autocad, build-batchrunner]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tải mọi gói zip đã build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Dựng thư mục stage cho Inno Setup
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.version }}"
          $stage = "dist/stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          foreach ($r in 2023, 2024, 2025, 2026) {
            Expand-Archive "artifacts/DhcbTools.Revit-$r-$v.zip" -DestinationPath "$stage/revit-$r" -Force
          }
          foreach ($a in 2024, 2025, 2026) {
            Expand-Archive "artifacts/DhcbTools.AutoCAD-$a-$v.zip" -DestinationPath "$stage/autocad-$a" -Force
          }
          Expand-Archive "artifacts/DhcbTools.BatchRunner-$v.zip" -DestinationPath "$stage/batchrunner" -Force

          # Bundle AutoCAD: AppVersion phải khớp phiên bản phát hành.
          $pc = Get-Content installer/PackageContents.xml -Raw
          $pc = $pc -replace 'AppVersion="[^"]*"', ('AppVersion="' + $v + '"')
          Set-Content "$stage/PackageContents.xml" $pc -Encoding UTF8

          Get-ChildItem $stage | Format-Table Name, Mode

      # Ghim 6.7.1. Inno Setup 7 đã ra (7.0.0 ngày 2026-05-14, 7.1.0 ngày 2026-08-10 — tag is-7_* của jrsoftware/issrc):
      # `choco install innosetup` không ghim sẽ kéo 7.x, cài vào thư mục khác "Inno Setup 6" mà bước dưới gọi, và
      # dhcb-tools.iss chưa thử với trình biên dịch 7. 6.7.1 là bản 6.x cuối cùng từng là bản mới nhất (02→05/2026)
      # nên chắc chắn có trên Chocolatey; 6.7.2/6.7.3 ra cùng ngày hoặc sau 7.0 nên có thể không được đăng.
      - name: Cài Inno Setup
        run: choco install innosetup --version=6.7.1 -y --no-progress

      - name: Đóng gói installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Không thấy $iscc — bước cài Inno Setup (ghim 6.7.1) không cài được bản 6." }
          & $iscc `
            "/DVersion=${{ needs.version.outputs.version }}" `
            "/DStageDir=..\dist\stage" `
            installer/dhcb-tools.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC biên dịch installer thất bại (mã $LASTEXITCODE)." }
          if (-not (Test-Path "dist/DhcbTools-Setup-${{ needs.version.outputs.version }}.exe" -PathType Leaf)) {
            throw "ISCC không tạo ra installer của phiên bản đã yêu cầu."
          }
          Get-ChildItem dist/*.exe

      - name: Ký số installer (nếu có chứng chỉ)
        shell: pwsh
        env:
          DHCB_SIGN_PFX_BASE64: ${{ secrets.DHCB_SIGN_PFX_BASE64 }}
          DHCB_SIGN_PFX_PASSWORD: ${{ secrets.DHCB_SIGN_PFX_PASSWORD }}
        run: |
          # dist/ lúc này có cả stage (DLL đã ký ở job build) và file Setup vừa dựng; chỉ cần ký file .exe.
          New-Item -ItemType Directory -Force -Path dist/setup | Out-Null
          Move-Item dist/*.exe dist/setup
          ./scripts/sign-release.ps1 -Path dist/setup -RequireSignature:($env:GITHUB_REF -like 'refs/tags/*')
          Move-Item dist/setup/*.exe dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DhcbTools-Setup
          path: dist/*.exe
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [verify, version, build-revit, build-autocad, build-batchrunner, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Danh sách gói
        run: ls -la dist

      # Ghim SHA (v2.4.x) thay vì tag di động: action này chạy trong job duy nhất có contents: write.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.zip
            dist/*.exe
          generate_release_notes: true
          name: DHCB Tools ${{ needs.version.outputs.version }}
