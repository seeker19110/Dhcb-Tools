# Quét bí mật rò rỉ vào Git (token, key, mật khẩu...) bằng gitleaks — thêm sau khi thấy
# repo project-template (seeker19110/project-template) dùng cách này, tới nay repo chỉ dựa
# vào .gitignore + tự soát tay trước khi push.
name: secret-scan

on:
  push:
    branches: [main]
  pull_request:

# Native Windows scanner only needs repository read access.
permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Không để GITHUB_TOKEN lại trong .git/config: không bước nào cần push.
          persist-credentials: false
          # Cần đủ lịch sử để quét hết các commit trong PR/push, không chỉ commit đầu.
          fetch-depth: 0

      - name: Quét bí mật bằng gitleaks Windows
        shell: powershell
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'gitleaks-8.30.1-windows-x64.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'gitleaks-8.30.1'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne 'D29144DEFF3A68AA93CED33DDDF84B7FDC26070ADD4AA0F4513094C8332AFC4E') {
            throw 'Gitleaks download checksum mismatch.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $directory -Force
          & (Join-Path $directory 'gitleaks.exe') git . --log-opts=--all --redact --exit-code=2 --report-format=sarif --report-path=results.sarif
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Tải báo cáo quét bí mật
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-windows-results
          path: results.sarif
