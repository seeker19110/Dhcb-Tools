# Quét bí mật rò rỉ vào Git (token, key, mật khẩu...) bằng gitleaks — thêm sau khi thấy
# repo project-template (seeker19110/project-template) dùng cách này, tới nay repo chỉ dựa
# vào .gitignore + tự soát tay trước khi push.
name: secret-scan

on:
  push:
    branches: [main]
  pull_request:

# gitleaks-action đọc danh sách commit của PR qua API → thiếu quyền đọc PR gây lỗi 403.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Cần đủ lịch sử để quét hết các commit trong PR/push, không chỉ commit đầu.
          fetch-depth: 0

      - name: Quét bí mật (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # gitleaks-action đọc danh sách commit của PR qua API GitHub → cần quyền đọc PR.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
