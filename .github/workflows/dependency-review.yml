# Cảnh báo khi PR thêm dependency có lỗ hổng đã biết (NuGet packages.lock.json,
# tools/autocad-mcp-server/requirements.txt, requirements-dev.txt...) — tham khảo
# từ repo project-template (seeker19110/project-template).
name: dependency-review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
