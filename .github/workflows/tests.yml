# CI: test tầng logic thuần + build kiểm tra toàn bộ Core/vỏ bằng API package NuGet (không cần cài Revit/AutoCAD).
# Vỏ Revit build với UseWPF=false (bỏ thư mục UI) vì runner Linux không có WindowsDesktop SDK — xem scripts/check-build.sh.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  logic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore tests/DhcbTools.Shared.Logic.Tests/DhcbTools.Shared.Logic.Tests.csproj

      - name: Build
        run: dotnet build tests/DhcbTools.Shared.Logic.Tests/DhcbTools.Shared.Logic.Tests.csproj --no-restore -c Release

      - name: Test
        run: dotnet test tests/DhcbTools.Shared.Logic.Tests/DhcbTools.Shared.Logic.Tests.csproj --no-build -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Tải kết quả test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'

  check-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Đúng bộ phiên bản mà release.yml đóng gói. 2025 = net8.0-windows, 2024/2023 = net48.
        # Trước đây CI chỉ build 2025, nên lỗi chỉ xảy ra trên net48 (Dictionary.GetValueOrDefault)
        # hoặc chỉ trên Revit ≤ 2023 (ElementId.Value) lọt tới tận bước phát hành.
        version: ['2025', '2024', '2023']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build BatchRunner
        run: dotnet build src/DhcbTools.BatchRunner/DhcbTools.BatchRunner.csproj -c Release

      - name: Check-build Core + vỏ (Revit/AutoCAD ${{ matrix.version }} API từ NuGet)
        run: |
          for proj in src/DhcbTools.Core/DhcbTools.Core.csproj src/DhcbTools.Core.AutoCAD/DhcbTools.Core.AutoCAD.csproj \
                      src/DhcbTools.Revit/DhcbTools.Revit.csproj src/DhcbTools.AutoCAD/DhcbTools.AutoCAD.csproj \
                      src/DhcbTools.AutoCAD.Core/DhcbTools.AutoCAD.Core.csproj; do
            dotnet build "$proj" -p:EnableWindowsTargeting=true \
              -p:RevitVersion=${{ matrix.version }} -p:AcadVersion=${{ matrix.version }} \
              -p:UseWPF=false -c Release
          done

      - name: Kiểm tra script Python
        if: matrix.version == '2025'   # không phụ thuộc TFM, chạy một lần là đủ
        run: |
          python3 -m py_compile scripts/dhcb_agent.py scripts/dhcb_mcp_server.py scripts/dhcb_ai.py \
            tools/autocad-mcp-server/server.py tools/autocad-mcp-server/panel_api.py
          python3 -m unittest discover -s tools/autocad-mcp-server -p 'test_*.py'

      - name: Kiểm tra JavaScript panel AutoCAD
        if: matrix.version == '2025'   # không phụ thuộc TFM, chạy một lần là đủ
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('tools/autocad-mcp-server/panel.html','utf8');const m=s.match(/<script>([\\s\\S]*?)<\\/script>/);if(!m)throw Error('script missing');new Function(m[1]);if(!s.includes('runCleanup(false)'))throw Error('real cleanup path missing');"

  # Build ĐẦY ĐỦ có WPF trên Windows — đúng thứ release.yml đóng gói.
  # Job check-build ở trên chạy UseWPF=false (Linux không có WindowsDesktop SDK), mà bật WPF
  # thì SDK BỎ System.IO khỏi implicit usings (tránh nhập nhằng System.IO.Path với
  # System.Windows.Shapes.Path). Vì thế add-in Revit từng hỏng CS0103 ở bản build thật trong khi
  # CI vẫn xanh — release.yml chỉ chạy khi đẩy tag nên không ai bắt được. Job này đóng khe hở đó.
  build-wpf-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        revit: ['2025', '2024', '2023']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build đầy đủ vỏ Revit (WPF, Revit ${{ matrix.revit }})
        run: dotnet build src/DhcbTools.Revit/DhcbTools.Revit.csproj -c Release -p:RevitVersion=${{ matrix.revit }}
