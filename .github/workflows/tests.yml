# CI Windows: logic/CLI, WPF đầy đủ theo SDK host và kiểm thử công cụ đi kèm.
name: tests
permissions:
  contents: read
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  logic-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Restore
        run: dotnet restore tests/DhcbTools.Shared.Logic.Tests/DhcbTools.Shared.Logic.Tests.csproj
      - name: Build
        run: dotnet build tests/DhcbTools.Shared.Logic.Tests/DhcbTools.Shared.Logic.Tests.csproj --no-restore -c Release
      - name: Test (ngưỡng phủ 100% dòng)
        run: |
          dotnet test tests/DhcbTools.Shared.Logic.Tests/DhcbTools.Shared.Logic.Tests.csproj --no-build -c Release --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --results-directory ./coverage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check-coverage.py ./coverage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test CLI BatchRunner
        run: dotnet test tests/DhcbTools.BatchRunner.Tests/DhcbTools.BatchRunner.Tests.csproj -c Release --logger "trx;LogFileName=batchrunner-cli-results.trx"
      - name: Đối chiếu BCF 2.1 với schema và reader độc lập
        run: |
          python -m pip install --quiet bcf-client==0.9.0 lxml==6.1.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $schema = Join-Path $env:RUNNER_TEMP 'bcf-schema'
          git init --quiet $schema
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $schema fetch --quiet --depth 1 https://github.com/buildingSMART/BCF-XML.git 92fdcf4bfaa8f0576e7562730f341fc7781e2065
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $schema checkout --quiet FETCH_HEAD -- Schemas
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tools/bcf-acceptance/DhcbTools.Bcf.Acceptance.csproj -c Release -- ./out/bcf-fixtures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/bcf-acceptance/verify.py ./out/bcf-fixtures "$schema/Schemas"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Đối chiếu bộ ca IDS của buildingSMART
        run: |
          $cases = Join-Path $env:RUNNER_TEMP 'bsids'
          git init --quiet $cases
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $cases fetch --quiet --depth 1 https://github.com/buildingSMART/IDS.git 870f9c4e6e8f414e737b4d84ca1aa9b46fc6c8f3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $cases checkout --quiet FETCH_HEAD -- Documentation/ImplementersDocumentation/TestCases
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ids-conformance.py "$cases/Documentation/ImplementersDocumentation/TestCases" --runner src/DhcbTools.BatchRunner/bin/Release/net10.0/DhcbTools.BatchRunner.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Tải kết quả test
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: '**/*-results.trx'

  check-build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Chỉ hỗ trợ .NET 10 (AutoCAD 2025+ có profile net10; Revit chỉ 2027). Bỏ net48 (2022–2024) và net8.
        include:
          - { version: '2025', acad-runtime: net10 }
          - { version: '2026', acad-runtime: net10 }
          - { version: '2027', acad-runtime: net10 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.version == '2027'
        with:
          python-version: '3.12'
      - name: Build toàn bộ Core, WPF và Core Console
        shell: powershell
        run: ./scripts/check-build.ps1 -RevitVersion 2027 -AcadVersion ${{ matrix.version }} -AcadRuntime ${{ matrix.acad-runtime }} -SkipTests
      - name: Build fixture nghiệm thu AutoCAD
        if: matrix.version == '2026' && matrix.acad-runtime == 'net10'
        run: dotnet build tools/acceptance/DhcbTools.AutoCAD.Acceptance.csproj -c Release -p:AcadVersion=2026
      - name: Nghiệm thu palette và form WPF trên Windows
        if: matrix.version == '2026' && matrix.acad-runtime == 'net10'
        shell: powershell
        run: ./tools/ui-acceptance/run-ui.ps1 -OutputRoot ./out/ui-acceptance
      - name: Tải báo cáo WPF
        if: always() && matrix.version == '2026' && matrix.acad-runtime == 'net10'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-ui-acceptance
          path: out/ui-acceptance
      - name: Cài Inno Setup cho kiểm thử installer
        if: matrix.version == '2027'
        run: |
          choco install innosetup --version=6.7.1 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:DHCB_ISCC = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
      - name: Kiểm tra Python (ngưỡng phủ 100% câu lệnh)
        if: matrix.version == '2027'
        run: |
          python -m pip install --quiet -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @(Get-ChildItem scripts/*.py, tools/autocad-mcp-server/*.py, tests/python/*.py | ForEach-Object { $_.FullName })
          python -m py_compile @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pyflakes @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m coverage run -m unittest discover -s tools/autocad-mcp-server -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m coverage run --append -m unittest discover -s tests/python -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/muc-luc-bang-chung.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m coverage report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Kiểm tra JavaScript panel AutoCAD
        if: matrix.version == '2027'
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('tools/autocad-mcp-server/panel.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/);if(!m)throw Error('script missing');new Function(m[1]);if(!s.includes('runCleanup(false)'))throw Error('real cleanup path missing');"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Kiểm cú pháp Windows PowerShell 5.1
        if: matrix.version == '2027'
        shell: powershell
        run: |
          $bad = 0
          foreach ($file in Get-ChildItem scripts/*.ps1, tools/acceptance/*.ps1, tools/ui-acceptance/*.ps1) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($parseError in $errors) {
              Write-Host "::error file=$($file.FullName),line=$($parseError.Extent.StartLineNumber)::$($parseError.Message)"
              $bad++
            }
          }
          if ($bad -gt 0) { exit 1 }

  quality-gate:
    if: ${{ always() }}
    needs: [logic-tests, check-build]
    runs-on: windows-latest
    steps:
      - name: Require every validation job to succeed
        shell: python
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          import json
          import os
          import sys
          results = json.loads(os.environ['NEEDS_JSON'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if not results or failed:
              print('Validation jobs did not all succeed:', failed, file=sys.stderr)
              sys.exit(1)
          print('All validation jobs passed.')
